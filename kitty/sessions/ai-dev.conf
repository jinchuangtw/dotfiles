# ~/.config/kitty/sessions/ai-dev.conf

# Optional: window size
os_window_size 140c 40c

# Use split layout
layout splits

# Left pane：AI CLI tools (open it by yourself!)
launch --title AI-agent --cwd=current fish -lc 'codex'

# nvim pane
launch --title Neovim --location=vsplit --bias=60 --cwd=current nvim

# command area
launch --title Shell --location=hsplit --bias=30 --cwd=current
